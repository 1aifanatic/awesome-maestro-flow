name: Markdown Links

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress './**/*.md'
          fail: true
